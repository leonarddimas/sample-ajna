<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sample bank for Strudel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e3ebe7;
    --ink: #10393b;
    --muted: #4f6f6e;
    --pad: #f6faf8;
    --line: #b7c9c3;
    --hit: #ff4f6d;
    --hit-ink: #ffffff;
    --code-bg: #10393b;
    --code-ink: #e3ebe7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12292b;
      --ink: #e3ebe7;
      --muted: #94b0ac;
      --pad: #1b3d3f;
      --line: #2f5557;
      --code-bg: #0b1b1c;
      --code-ink: #e3ebe7;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 1rem; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 1rem;
    line-height: 1.5;
  }
  main { max-width: 64rem; margin: 0 auto; padding: 3rem 1.25rem 5rem; }

  h1 {
    font-size: clamp(2.75rem, 11vw, 7rem);
    line-height: .9;
    font-weight: 800;
    letter-spacing: -.04em;
    margin: 0 0 1.25rem;
    overflow-wrap: anywhere;
  }
  .lede { max-width: 38rem; color: var(--muted); font-size: 1.125rem; margin: 0 0 2rem; }

  .usage {
    background: var(--code-bg);
    color: var(--code-ink);
    border-radius: .75rem;
    padding: 1rem 1.25rem;
    display: flex; gap: 1rem; align-items: center; justify-content: space-between; flex-wrap: wrap;
  }
  .usage code {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: clamp(.9rem, 2.6vw, 1.1rem);
    overflow-wrap: anywhere;
  }
  button, input { font: inherit; color: inherit; }
  .copy {
    background: var(--hit); color: var(--hit-ink);
    border: 0; border-radius: .5rem; padding: .5rem 1rem; font-weight: 600; cursor: pointer;
  }
  .hint { color: var(--muted); margin: .75rem 0 0; font-size: .9375rem; }

  .tools { display: flex; gap: 1rem; align-items: baseline; justify-content: space-between; flex-wrap: wrap; margin: 3.5rem 0 1.5rem; }
  .tools h2 { margin: 0; font-size: 1.5rem; font-weight: 600; letter-spacing: -.01em; }
  .tools input {
    width: min(100%, 18rem);
    background: var(--pad); border: 1.5px solid var(--line); border-radius: .5rem; padding: .5rem .75rem;
  }

  .bank { margin: 0 0 2.5rem; }
  .bank-head { display: flex; align-items: baseline; gap: .75rem; flex-wrap: wrap; margin: 0 0 .75rem; }
  .bank-head h3 { margin: 0; font-size: 1.375rem; font-weight: 600; }
  .bank-head span { color: var(--muted); font-size: .9375rem; }
  .bank-head button {
    margin-left: auto; background: none; border: 1.5px solid var(--line); border-radius: .5rem;
    padding: .25rem .75rem; cursor: pointer; font-size: .875rem;
  }
  .bank-head button:hover { border-color: var(--ink); }

  .pads { display: grid; grid-template-columns: repeat(auto-fill, minmax(5.5rem, 1fr)); gap: .625rem; }
  .pad {
    aspect-ratio: 1;
    background: var(--pad);
    border: 1.5px solid var(--line);
    border-radius: .5rem;
    cursor: pointer;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start;
    padding: .5rem .625rem;
    text-align: left;
    font-weight: 600;
    transition: background-color .08s, border-color .08s;
  }
  .pad small { font-weight: 400; color: var(--muted); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pad:hover { border-color: var(--ink); }
  .pad.playing { background: var(--hit); border-color: var(--hit); color: var(--hit-ink); }
  .pad.playing small { color: var(--hit-ink); }
  :focus-visible { outline: 3px solid var(--hit); outline-offset: 2px; }

  .status { color: var(--muted); padding: 2rem 0; }
  .status code { font-family: ui-monospace, Menlo, Consolas, monospace; }
  footer { margin-top: 4rem; color: var(--muted); font-size: .9375rem; }
  footer a { color: inherit; }
  @media (prefers-reduced-motion: reduce) { .pad { transition: none; } }
</style>
</head>
<body>
<main>
  <h1 id="title">Sample bank</h1>
  <p class="lede" id="lede">Sounds for live coding with Strudel. Load the bank, then play any sound by name.</p>

  <div class="usage">
    <code id="snippet">samples('github:user/repo')</code>
    <button class="copy" id="copy-snippet" type="button">Copy</button>
  </div>
  <p class="hint">Paste this line at the top of a pattern in <a href="https://strudel.cc" target="_blank" rel="noopener">strudel.cc</a>, then use <code>s("name")</code> or <code>s("name:2")</code> for a specific variation.</p>

  <div class="tools">
    <h2 id="count">Sounds</h2>
    <input id="filter" type="search" placeholder="Filter sounds" aria-label="Filter sounds">
  </div>

  <div id="banks"><p class="status">Loading sounds…</p></div>

  <footer id="footer"></footer>
</main>

<script>
// Optional: set these by hand if the auto-detected values are wrong.
const CONFIG = {
  user: "",        // GitHub username, e.g. "alice"
  repo: "",        // repository name, e.g. "my-samples"
  branch: "main",
  title: "",       // page title, defaults to the repo name
  description: ""  // short intro line
};

(function () {
  const host = location.hostname;
  const user = CONFIG.user || (host.endsWith(".github.io") ? host.split(".")[0] : "user");
  const repo = CONFIG.repo || (location.pathname.split("/").filter(Boolean)[0] || host.split(".")[0] || "repo");
  const title = CONFIG.title || repo;
  const snippetText = "samples('github:" + user + "/" + repo + "')";

  document.title = title + " · Sample bank for Strudel";
  document.getElementById("title").textContent = title;
  if (CONFIG.description) document.getElementById("lede").textContent = CONFIG.description;
  document.getElementById("snippet").textContent = snippetText;
  document.getElementById("footer").innerHTML =
    'Hosted on <a href="https://github.com/' + user + '/' + repo + '">GitHub</a>. Made for <a href="https://strudel.cc">Strudel</a>.';

  function copy(text, btn) {
    const done = () => { const old = btn.textContent; btn.textContent = "Copied"; setTimeout(() => btn.textContent = old, 1200); };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, done); else done();
  }
  document.getElementById("copy-snippet").addEventListener("click", e => copy(snippetText, e.currentTarget));

  // Turn the strudel.json entries into { name, files: [{label, url}] }
  function normalize(json) {
    const base = typeof json._base === "string" ? json._base : "";
    const abs = p => /^https?:\/\//.test(p) ? p : (base ? base + p : new URL(p, location.href).href);
    const banks = [];
    for (const [name, val] of Object.entries(json)) {
      if (name === "_base") continue;
      const files = [];
      if (typeof val === "string") files.push({ label: "", url: abs(val) });
      else if (Array.isArray(val)) val.forEach(p => files.push({ label: "", url: abs(p) }));
      else if (val && typeof val === "object") {
        for (const [key, v] of Object.entries(val)) (Array.isArray(v) ? v : [v]).forEach(p => files.push({ label: key, url: abs(p) }));
      }
      if (files.length) banks.push({ name, files });
    }
    return banks.sort((a, b) => a.name.localeCompare(b.name));
  }

  const audio = new Audio();
  let activePad = null;
  function play(pad, url) {
    audio.pause();
    if (activePad) activePad.classList.remove("playing");
    audio.src = url;
    audio.currentTime = 0;
    activePad = pad;
    pad.classList.add("playing");
    audio.play().catch(() => pad.classList.remove("playing"));
  }
  audio.addEventListener("ended", () => { if (activePad) activePad.classList.remove("playing"); });

  const root = document.getElementById("banks");
  let banks = [];

  function render(filter) {
    const q = (filter || "").trim().toLowerCase();
    const shown = banks.filter(b => b.name.toLowerCase().includes(q));
    document.getElementById("count").textContent =
      banks.length + (banks.length === 1 ? " sound" : " sounds") + (q ? " · " + shown.length + " shown" : "");
    root.textContent = "";
    if (!shown.length) {
      root.innerHTML = '<p class="status">No sounds match that filter.</p>';
      return;
    }
    for (const b of shown) {
      const sec = document.createElement("section");
      sec.className = "bank";
      const head = document.createElement("div");
      head.className = "bank-head";
      head.innerHTML = "<h3></h3><span></span><button type='button'>Copy s(\"…\")</button>";
      head.querySelector("h3").textContent = b.name;
      head.querySelector("span").textContent = b.files.length + (b.files.length === 1 ? " file" : " variations");
      head.querySelector("button").addEventListener("click", e => copy('s("' + b.name + '")', e.currentTarget));
      const pads = document.createElement("div");
      pads.className = "pads";
      b.files.forEach((f, i) => {
        const pad = document.createElement("button");
        pad.type = "button";
        pad.className = "pad";
        pad.innerHTML = "<span></span><small></small>";
        pad.firstChild.textContent = b.name + ":" + i;
        pad.lastChild.textContent = f.label || decodeURIComponent(f.url.split("/").pop());
        pad.setAttribute("aria-label", "Play " + b.name + " variation " + i);
        pad.addEventListener("click", () => play(pad, f.url));
        pads.appendChild(pad);
      });
      sec.append(head, pads);
      root.appendChild(sec);
    }
  }

  document.getElementById("filter").addEventListener("input", e => render(e.target.value));

  fetch("strudel.json", { cache: "no-cache" })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(json => { banks = normalize(json); render(""); })
    .catch(() => {
      document.getElementById("count").textContent = "Sounds";
      root.innerHTML = '<p class="status">Couldn’t find <code>strudel.json</code> next to this page. Add one to the root of the repository and reload.</p>';
    });
})();
</script>
</body>
</html>
